<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Giovanni</title>

<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial;
  }

  .calculadora{
    background:#222;
    padding:20px;
    border-radius:20px;
    width:340px;
    box-shadow:0 0 30px rgba(0,0,0,0.7);
  }

  h1{
    color:#00ff99;
    text-align:center;
    margin-bottom:15px;
  }

  #display{
    width:100%;
    height:70px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:2rem;
    text-align:right;
    padding:10px;
    box-sizing:border-box;
    background:#000;
    color:white;
  }

  .botoes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }

  button{
    height:65px;
    border:none;
    border-radius:12px;
    font-size:1.2rem;
    cursor:pointer;
    background:#444;
    color:white;
    transition:0.2s;
  }

  button:hover{
    transform:scale(1.05);
    background:#666;
  }

  .operador{
    background:orange;
  }

  .igual{
    background:#00aa66;
  }

  .limpar{
    background:#cc3333;
  }
</style>
</head>
<body>

<div class="calculadora">
  <h1>Giovanni</h1>

  <input type="text" id="display" disabled>

  <div class="botoes">
    <button class="limpar" onclick="limpar()">C</button>
    <button class="operador" onclick="adicionar('%')">%</button>
    <button class="operador" onclick="apagar()">⌫</button>
    <button class="operador" onclick="adicionar('/')">÷</button>

    <button onclick="adicionar('7')">7</button>
    <button onclick="adicionar('8')">8</button>
    <button onclick="adicionar('9')">9</button>
    <button class="operador" onclick="adicionar('*')">×</button>

    <button onclick="adicionar('4')">4</button>
    <button onclick="adicionar('5')">5</button>
    <button onclick="adicionar('6')">6</button>
    <button class="operador" onclick="adicionar('-')">−</button>

    <button onclick="adicionar('1')">1</button>
    <button onclick="adicionar('2')">2</button>
    <button onclick="adicionar('3')">3</button>
    <button class="operador" onclick="adicionar('+')">+</button>

    <button onclick="adicionar('00')">00</button>
    <button onclick="adicionar('0')">0</button>
    <button onclick="adicionar('.')">.</button>
    <button class="igual" onclick="calcular()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById("display");

  function adicionar(valor){
    display.value += valor;
  }

  function limpar(){
    display.value = "";
  }

  function apagar(){
    display.value = display.value.slice(0, -1);
  }

  function calcular(){
    try{
      let resultado = eval(display.value);
      display.value = Number(resultado).toLocaleString('pt-BR');
    }catch{
      display.value = "Erro";
    }
  }
</script>

</body>
</html>
