<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Giovanni</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
      font-family: Arial, sans-serif;
    }

    .calculadora {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      width: 320px;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 15px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    #display {
      width: 100%;
      height: 60px;
      font-size: 2rem;
      text-align: right;
      margin-bottom: 15px;
      border: none;
      border-radius: 12px;
      padding: 10px;
      background: #111;
      color: #00ff99;
      box-sizing: border-box;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      background: #444;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #666;
      transform: scale(1.05);
    }

    .operador {
      background: orange;
    }

    .operador:hover {
      background: darkorange;
    }

    .igual {
      background: #00aa66;
    }

    .igual:hover {
      background: #00cc77;
    }

    .limpar {
      background: #cc3333;
    }

    .limpar:hover {
      background: #ff4444;
    }
  </style>
</head>
<body>

  <div class="calculadora">
    <h1>Giovanni</h1>

    <input type="text" id="display" disabled>

    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button class="operador" onclick="adicionar('/')">÷</button>
      <button class="operador" onclick="adicionar('*')">×</button>
      <button class="operador" onclick="adicionar('-')">−</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('+')">+</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="igual" onclick="calcular()">=</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button onclick="adicionar('0')">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function adicionar(valor) {
      display.value += valor;
    }

    function limpar() {
      display.value = "";
    }

    function calcular() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = "Erro";
      }
    }
  </script>

</body>
</html>
